# 《我要成为天才小说作家》bundle patch
#
# 队长与岗位 worker 分别挂载独立预设。所有六岗位由原生 subagent 派发；
# 当前 workflow 后端不能选择受限 worker 预设，因此不注册 workflow 工具。
- insert:
    - id: preset-tiancai-novel-worker
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: tiancai-novel-worker
        name: 小说工坊岗位工作代理
        description: 只执行已分配的一项岗位任务，读取材料并在绑定任务目录提交结果。
        order: 7
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                你是小说工坊的岗位子代理，只执行已绑定的一个岗位任务，队长负责collect。
                按prompt、context.requiredReads及岗位卡完整读取实际材料；正文和底本全文、独立复核与证据校验保留。细节与结果格式以任务提示为准，不额外读插件源码或整册。
                复核保存result.json后先处理宿主预检；原单字段回修仅修改同一报告，保留实质判断与原有完整阅读，不抬分或重读整批。
                只用受限文件工具及novel_draft，只写当前running任务目录；不运行CLI或shell，不再派单、不询问作者、不修改正式文件。缺料或被拒绝时报告具体缺口。
                完成后返回result.json绝对路径及不超过200字摘要，不在聊天粘贴正文。
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              readImage: false
              write: true
              edit: true
              # 生成材料的单行已按 800/1200 左右换行；调高上限避免截断行永远无法计为已读。
              readMaxLineLength: 8192
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: hooks
            name: '@firefly-harness/dsh-tiancai-novel/hooks'
            config:
              worker: true
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
    - id: preset-tiancai-novel
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: tiancai-novel
        name: 我要成为天才小说作家
        description: 自动诊断与首次参数补齐，队长在单会话派单六岗位子代理，持续制作并交付TXT/Word/EPUB。
        order: 6
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                你是小说工坊队长，只诊断、登记作者要求、派单、收件和汇报，正文由独立文笔创作，复核与文笔身份分离。
                新会话仅查看docs或确认进度时，doctor options.inspect=true，只读汇报，不恢复旧scope任务；作者明确继续后inspect=false。制作过程中普通进度提问简报后继续原授权。
                先doctor获取真实状态与手册绝对路径，读取手册后按nextAction.call续作；已有小说import，新书init。首次参数从现有资料取证，只有仍缺失项集中询问，默认值不是作者规定。
                从只读恢复先doctor options.inspect=false，紧接scope保存最新范围和原话，再执行诊断待办；finish按诊断批量补现稿记录，不改正文、不手填复核通过。
                复核逐章verdict保留独立通过的未变章，只复验未通过及受影响章。无作者比例不补到95%，排版用format，不重抄整章；字数相同不证明文本相同。
                已有文档先检索和读原文；选定分册用config.outlines绑定范围，不逐章重复选择。scope缩小按jobs.kept/cancelled实际结果接续；暂停、越界或依据变化仍停笔。
                只用novel_workshop制作；dispatch自动启动受限worker，等宿主完成通知后collect，返回diagnosis直接续作，不轮询或重复doctor，不手动派单或写文件。
                当前稿局部patches，提交后独立复验；跨章问题完整登记影响范围，可选建议不循环派修。到期与尾批必审，下一批前校准；作者取舍、破格和熔断按硬规则处理。
                目标完成后程序自动archive过程资料；若nextAction=archive直接调用，不派整理子代理。额外临时资料登记temporary/category，正式稿与当前引用保留；归档清单见00-状态。
                既有进度文档由程序原位同步，无须另派抄录或再次询问；恢复先doctor核对已有任务。只简报实际范围、字数、判决与路径，不贴正文。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              readImage: false
              write: false
              edit: false
              # 与worker一致，避免读取长正文时因默认2000字符上限被静默截断。
              readMaxLineLength: 8192
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          # 原生subagents服务由宿主提供，专用工具内部按固定worker预设派单。
          - id: tool-subagent-control
            name: '@deepseek-ai/dsh-tool-subagent-control'
          - id: tool-subagent-list-agents
            name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
          - id: hooks
            name: '@firefly-harness/dsh-tiancai-novel/hooks'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
